name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - '.devcontainer/Dockerfile'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch: # Позволяет запускать сборку вручную по кнопке

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      # Устанавливаем современный сборщик Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      # Авторизуемся в вашем Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      # Собираем и пушим образ
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/px4-sim:latest
          # Настраиваем кеширование для ускорения будущих сборок
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/px4-sim:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/px4-sim:buildcache,mode=max
